name: WR1300E v2 - OpenWrt 25.12.6 - Fix official kernel ABI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android /opt/ghc || true
          df -h .
      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync unzip zlib1g-dev file wget xz-utils swig time curl ca-certificates zstd
      - name: Build with official buildbot config; verify ABI before image packaging
        run: bash ./build.sh
      - name: Upload diagnostics (ALWAYS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WR1300E_ABI_FIX_V2_diagnostics
          path: |
            defconfig.log
            effective.config
            official_config.buildinfo
            feeds-revisions.txt
            kernel-config.set
            kernel-vermagic.txt
            early-abi-result.json
            abi-result.json
            openwrt/bin/targets/ramips/mt7621/profiles.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload firmware ONLY if official ABI matches
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WR1300E_v2_25.12.6_OFFICIAL_ABI_UNTESTED
          path: |
            openwrt/bin/targets/ramips/mt7621/*cudy_wr1300e-v2*squashfs-sysupgrade.bin
            openwrt/bin/targets/ramips/mt7621/profiles.json
            abi-result.json
            firmware.sha256
          if-no-files-found: error
          retention-days: 30
